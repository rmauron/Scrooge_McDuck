project:
  type: website
  output-dir: _site
  brand:
    light: _brand.yml
    dark: _brand-dark.yml
  resources:           # the shinylive export is not a .qmd, so name it explicitly
    - shinylive_app/**
  # Must build the wasm bundle *before* the resources above are enumerated,
  # otherwise only index.html reaches _site/ and the app frame renders blank.
  pre-render: export_shinylive.R
website:
  title: "Scrooge McDuck"
  navbar:              # list the entries yourself
    left:
      - href: index.qmd
        text: Home
      - href: analysis_1.qmd
        text: Analysis 1
      - href: analysis_2.qmd
        text: Analysis 2
      - href: analysis_3.qmd
        text: Analysis 3
      - href: analysis_4.qmd
        text: Analysis 4
format:
  html:
    theme: [cosmo, brand]
execute:
  freeze: auto