project:
  type: website
  output-dir: _site
  brand:
    light: _brand.yml
    dark: _brand-dark.yml
  resources:           # the shinylive export is not a .qmd, so name it explicitly
    - shinylive_app/**
  # Must build the wasm bundle *before* the resources above are enumerated,
  # otherwise only index.html reaches _site/ and the app frame renders blank.
  pre-render: export_shinylive.R
website:
  title: "Scrooge McDuck"
  navbar:
    left:
      - href: analysis_1.qmd
        text: Follow the money
      - href: analysis_4.qmd
        text: Happiness on a map
      - href: analysis_3.qmd
        text: Find your match
      - href: analysis_2.qmd
        text: Behind the data
format:
  html:
    theme: [cosmo, brand]
    css: styles.css
    
execute:
  freeze: auto